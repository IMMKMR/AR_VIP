<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR Target Compiler Helper</title>
</head>
<body>
  <h1>Compiling 1.jpg...</h1>
  <div id="status">Starting...</div>

  <script type="module">
    import { Compiler } from '/src/vendor/mindar-image.prod.js';

    window.compileTarget = async function(imageUrl) {
      document.getElementById('status').textContent = 'Loading image...';
      const compiler = new Compiler();
      const img = new Image();
      img.crossOrigin = 'Anonymous';

      return new Promise((resolve, reject) => {
        img.onload = async () => {
          try {
            document.getElementById('status').textContent = 'Extracting feature points...';
            await compiler.compileImageTargets([img], (progress) => {
              document.getElementById('status').textContent = `Compiling: ${Math.round(progress * 100)}%`;
            });

            document.getElementById('status').textContent = 'Exporting data buffer...';
            const buffer = await compiler.exportData();
            
            // Convert ArrayBuffer to Base64 string for clean transport to Node
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            const base64 = window.btoa(binary);
            
            document.getElementById('status').textContent = 'COMPLETE';
            resolve(base64);
          } catch (err) {
            reject(err.message || String(err));
          }
        };
        img.onerror = () => reject('Failed to load image: ' + imageUrl);
        img.src = imageUrl;
      });
    };
  </script>
</body>
</html>
